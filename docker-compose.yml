services:
  db:
    build:
      context: ./db
    container_name: factoring_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - factoring_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factoring_user} -d ${POSTGRES_DB:-factoring_core_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./back
    container_name: factoring_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - factoring_network

  frontend:
    build:
      context: ./front
    container_name: factoring_frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    networks:
      - factoring_network

networks:
  factoring_network:
    driver: bridge
